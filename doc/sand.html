<!DOCTYPE html>
<html lang="zh-CN" style="height: 100%">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 散点图 - 自包含版本</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      height: 100%;
      margin: 0;
      background-color: #1a1a2e;
      overflow: hidden;
    }
    #container {
      height: 100%;
      width: 100%;
    }
  </style>
</head>
<body style="height: 100%; margin: 0">
  <div id="container" style="height: 100%"></div>

  <!-- 使用 CDN 加载 ECharts 和 ECharts GL -->
  <script src="https://fastly.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts-gl@2/dist/echarts-gl.min.js"></script>

  <script type="text/javascript">
    // ============================================
    // 内嵌数据 - 模拟世界各国人口、收入、预期寿命数据
    // 数据格式: [收入, 预期寿命, 人口(百万), 国家, 年份]
    // ============================================
    var data = [
      // 发达国家 / 高收入国家
      [52345, 82.5, 128.3, '美国', 2020],
      [41234, 83.1, 55.6, '日本', 2020],
      [45123, 81.9, 67.8, '德国', 2020],
      [39876, 81.2, 66.4, '英国', 2020],
      [43210, 82.8, 67.1, '法国', 2020],
      [48901, 83.5, 59.5, '加拿大', 2020],
      [46234, 83.9, 25.4, '澳大利亚', 2020],
      [35678, 80.5, 47.2, '西班牙', 2020],
      [37890, 80.8, 60.4, '意大利', 2020],
      [40789, 82.1, 17.5, '荷兰', 2020],
      [49876, 84.2, 8.7, '瑞士', 2020],
      [42567, 81.7, 10.8, '瑞典', 2020],
      [38901, 81.3, 14.3, '比利时', 2020],
      [35234, 79.8, 18.9, '葡萄牙', 2020],
      [41230, 81.5, 9.2, '以色列', 2020],
      [38765, 80.9, 5.3, '新加坡', 2020],
      [44567, 82.3, 51.3, '韩国', 2020],
      
      // 中等收入国家
      [15678, 76.5, 1412.1, '中国', 2020],
      [9876, 69.8, 1380.0, '印度', 2020],
      [11234, 75.1, 213.0, '巴西', 2020],
      [10890, 74.2, 145.9, '俄罗斯', 2020],
      [13456, 76.8, 128.9, '墨西哥', 2020],
      [9870, 72.5, 267.7, '印尼', 2020],
      [11234, 77.2, 83.7, '土耳其', 2020],
      [12567, 79.1, 69.8, '泰国', 2020],
      [8901, 71.4, 110.8, '菲律宾', 2020],
      [7654, 69.2, 97.3, '越南', 2020],
      [14321, 79.5, 58.4, '波兰', 2020],
      [15678, 80.2, 22.3, '智利', 2020],
      [12345, 77.8, 45.8, '阿根廷', 2020],
      [9876, 76.1, 43.5, '哥伦比亚', 2020],
      [13456, 78.9, 32.1, '马来西亚', 2020],
      [11234, 74.8, 23.6, '秘鲁', 2020],
      
      // 低收入发展中国家
      [2345, 62.3, 206.1, '尼日利亚', 2020],
      [1987, 66.5, 118.9, '埃塞俄比亚', 2020],
      [1654, 64.8, 54.6, '肯尼亚', 2020],
      [1234, 60.2, 45.7, '坦桑尼亚', 2020],
      [2876, 67.8, 32.4, '加纳', 2020],
      [1987, 61.5, 44.8, '乌干达', 2020],
      [2345, 63.9, 38.2, '喀麦隆', 2020],
      [1654, 59.8, 28.5, '莫桑比克', 2020],
      [1234, 54.1, 21.4, '塞拉利昂', 2020],
      [1987, 66.2, 19.1, '塞内加尔', 2020],
      [2876, 68.5, 30.4, '赞比亚', 2020],
      [1654, 60.8, 19.8, '乍得', 2020],
      [2345, 67.2, 31.9, '马里', 2020],
      [1234, 53.5, 18.2, '中非', 2020],
      
      // 其他主要国家
      [18976, 82.1, 13.7, '挪威', 2020],
      [19876, 81.8, 5.9, '丹麦', 2020],
      [17987, 81.6, 5.6, '芬兰', 2020],
      [43210, 80.5, 332.6, '美国', 2020],
      [16543, 80.1, 83.2, '伊朗', 2020],
      [14876, 79.8, 101.7, '埃及', 2020],
      [19876, 80.5, 37.1, '阿联酋', 2020],
      [23456, 79.2, 34.8, '沙特', 2020],
      [8765, 71.9, 166.3, '孟加拉', 2020],
      [7654, 70.2, 28.2, '阿富汗', 2020],
      [12345, 76.5, 29.1, '伊拉克', 2020],
      [9876, 77.2, 6.8, '黎巴嫩', 2020]
    ];

    // 图表配置
    var dom = document.getElementById('container');
    var myChart = echarts.init(dom, null, {
      renderer: 'canvas',
      useDirtyRect: false
    });

    // 符号大小倍数（根据人口缩放，更好看）
    var symbolSize = 3;
    
    var option = {
      title: {
        text: '世界各国发展数据 3D 散点图',
        subtext: 'X轴: 人口(百万人) | Y轴: 预期寿命(岁) | Z轴: 人均收入(美元)',
        left: 'center',
        top: 10,
        textStyle: {
          color: '#ffffff',
          fontSize: 14
        },
        subtextStyle: {
          color: '#aaaaaa',
          fontSize: 11
        }
      },
      tooltip: {
        trigger: 'item',
        formatter: function(params) {
          if (params.seriesType === 'scatter3D') {
            var d = params.data;
            return '<strong>' + d[3] + '</strong><br/>' +
              '人均收入: $' + d[0].toLocaleString() + '<br/>' +
              '预期寿命: ' + d[1] + ' 岁<br/>' +
              '人口: ' + d[2] + ' 百万人<br/>' +
              '年份: ' + d[4];
          }
          return params.name;
        }
      },
      grid3D: {
        viewControl: {
          autoRotate: true,
          autoRotateSpeed: 2,
          distance: 200,
          zoomSensitivity: 1,
          rotateSensitivity: 1
        },
        light: {
          main: {
            intensity: 1.2,
            shadow: true
          },
          ambient: {
            intensity: 0.6
          }
        },
        axisLine: {
          lineStyle: { color: '#888', width: 1 }
        },
        axisLabel: {
          color: '#ccc',
          fontSize: 10
        },
        axisTick: {
          show: false
        }
      },
      xAxis3D: {
        name: '人口 (百万人)',
        nameTextStyle: { color: '#ddd', fontSize: 12 },
        type: 'value'
      },
      yAxis3D: {
        name: '预期寿命 (岁)',
        nameTextStyle: { color: '#ddd', fontSize: 12 },
        type: 'value',
        min: 50,
        max: 90
      },
      zAxis3D: {
        name: '人均收入 (美元)',
        nameTextStyle: { color: '#ddd', fontSize: 12 },
        type: 'value',
        axisLabel: {
          formatter: function(value) {
            return '$' + (value / 1000).toFixed(0) + 'k';
          }
        }
      },
      series: [
        {
          name: '世界各国数据',
          type: 'scatter3D',
          data: data,
          symbolSize: function(dataItem) {
            // 根据人口调整点大小：人口越多点越大，范围 2-8
            var pop = dataItem[2];
            return Math.min(8, Math.max(2, pop / 30));
          },
          itemStyle: {
            color: function(param) {
              // 根据收入水平着色：低收入红色，中收入黄色，高收入绿色到蓝色
              var income = param.data[0];
              if (income < 5000) return '#ff6b6b';      // 低收入 - 红色
              if (income < 15000) return '#ffb347';     // 中低收入 - 橙色
              if (income < 30000) return '#66cc66';     // 中高收入 - 绿色
              return '#4d9eff';                          // 高收入 - 蓝色
            },
            opacity: 0.85,
            borderWidth: 0.5,
            borderColor: '#ffffff'
          },
          emphasis: {
            scale: 1.5,
            label: {
              show: true,
              formatter: function(params) {
                return params.data[3];
              },
              position: 'top',
              textStyle: {
                color: '#fff',
                fontSize: 12,
                backgroundColor: 'rgba(0,0,0,0.6)',
                padding: [2, 5, 2, 5],
                borderRadius: 4
              }
            }
          },
          encode: {
            x: 2,   // 人口 (索引2)
            y: 1,   // 预期寿命 (索引1)
            z: 0,   // 收入 (索引0)
            tooltip: [0, 1, 2, 3, 4]
          }
        }
      ],
      backgroundColor: '#1a1a2e',
      textStyle: {
        color: '#ddd'
      }
    };

    myChart.setOption(option);

    // 窗口大小自适应
    window.addEventListener('resize', function() {
      myChart.resize();
    });

    // 控制台输出加载完成信息
    console.log('3D 散点图已加载，数据点数量: ' + data.length);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>COP性能气泡图 | 红黄绿蓝渐变 + 大小双映射</title>
    <!-- 引入 ECharts 核心库及 GL 扩展 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts-gl@2.0.9/dist/echarts-gl.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f5f7fb;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        #main {
            width: 100vw;
            height: 100vh;
            background: #fefefe;
            position: relative;
        }
    </style>
</head>
<body>
<div id="main"></div>

<script>
    (function() {
        // ------------------------------------------------------------
        // 完整原始数据 (基于提供的Excel数据, 150个点)
        // 字段顺序: [冷冻供水温度, 冷却回水温度, 负荷率, COP]
        // ------------------------------------------------------------
        const rawDataRows = [
            // 冷冻供水 6℃, 冷却回水30℃
            [6,30,0.1,0.494],[6,30,0.2,0.877],[6,30,0.3,1.182],[6,30,0.4,1.433],[6,30,0.5,1.645],
            [6,30,0.6,1.826],[6,30,0.7,1.982],[6,30,0.8,2.115],[6,30,0.9,2.23],[6,30,1.0,2.329],
            // 6℃, 32℃
            [6,32,0.1,0.434],[6,32,0.2,0.771],[6,32,0.3,1.039],[6,32,0.4,1.26],[6,32,0.5,1.446],
            [6,32,0.6,1.605],[6,32,0.7,1.743],[6,32,0.8,1.86],[6,32,0.9,1.961],[6,32,1.0,2.048],
            // 6℃, 34℃
            [6,34,0.1,0.383],[6,34,0.2,0.681],[6,34,0.3,0.918],[6,34,0.4,1.114],[6,34,0.5,1.279],
            [6,34,0.6,1.42],[6,34,0.7,1.542],[6,34,0.8,1.646],[6,34,0.9,1.736],[6,34,1.0,1.814],
            // 6℃, 36℃
            [6,36,0.1,0.34],[6,36,0.2,0.604],[6,36,0.3,0.814],[6,36,0.4,0.989],[6,36,0.5,1.135],
            [6,36,0.6,1.26],[6,36,0.7,1.368],[6,36,0.8,1.461],[6,36,0.9,1.541],[6,36,1.0,1.61],
            // 6℃, 38℃
            [6,38,0.1,0.303],[6,38,0.2,0.538],[6,38,0.3,0.726],[6,38,0.4,0.881],[6,38,0.5,1.012],
            [6,38,0.6,1.124],[6,38,0.7,1.22],[6,38,0.8,1.303],[6,38,0.9,1.374],[6,38,1.0,1.436],
            // 冷冻供水 7℃, 冷却回水30℃
            [7,30,0.1,0.575],[7,30,0.2,1.022],[7,30,0.3,1.376],[7,30,0.4,1.669],[7,30,0.5,1.915],
            [7,30,0.6,2.125],[7,30,0.7,2.307],[7,30,0.8,2.463],[7,30,0.9,2.597],[7,30,1.0,2.713],
            // 7℃, 32℃
            [7,32,0.1,0.506],[7,32,0.2,0.899],[7,32,0.3,1.21],[7,32,0.4,1.468],[7,32,0.5,1.684],
            [7,32,0.6,1.869],[7,32,0.7,2.029],[7,32,0.8,2.166],[7,32,0.9,2.284],[7,32,1.0,2.386],
            // 7℃, 34℃
            [7,34,0.1,0.446],[7,34,0.2,0.793],[7,34,0.3,1.069],[7,34,0.4,1.297],[7,34,0.5,1.489],
            [7,34,0.6,1.653],[7,34,0.7,1.795],[7,34,0.8,1.917],[7,34,0.9,2.022],[7,34,1.0,2.112],
            // 7℃, 36℃
            [7,36,0.1,0.396],[7,36,0.2,0.703],[7,36,0.3,0.948],[7,36,0.4,1.151],[7,36,0.5,1.322],
            [7,36,0.6,1.467],[7,36,0.7,1.593],[7,36,0.8,1.702],[7,36,0.9,1.795],[7,36,1.0,1.875],
            // 7℃, 38℃
            [7,38,0.1,0.353],[7,38,0.2,0.626],[7,38,0.3,0.845],[7,38,0.4,1.026],[7,38,0.5,1.178],
            [7,38,0.6,1.308],[7,38,0.7,1.42],[7,38,0.8,1.517],[7,38,0.9,1.6],[7,38,1.0,1.672],
            // 冷冻供水 8℃, 冷却回水30℃
            [8,30,0.1,0.664],[8,30,0.2,1.181],[8,30,0.3,1.59],[8,30,0.4,1.928],[8,30,0.5,2.213],
            [8,30,0.6,2.456],[8,30,0.7,2.666],[8,30,0.8,2.846],[8,30,0.9,3.001],[8,30,1.0,3.135],
            // 8℃, 32℃
            [8,32,0.1,0.585],[8,32,0.2,1.04],[8,32,0.3,1.4],[8,32,0.4,1.698],[8,32,0.5,1.949],
            [8,32,0.6,2.163],[8,32,0.7,2.348],[8,32,0.8,2.507],[8,32,0.9,2.644],[8,32,1.0,2.762],
            // 8℃, 34℃
            [8,34,0.1,0.516],[8,34,0.2,0.917],[8,34,0.3,1.236],[8,34,0.4,1.5],[8,34,0.5,1.722],
            [8,34,0.6,1.912],[8,34,0.7,2.076],[8,34,0.8,2.217],[8,34,0.9,2.337],[8,34,1.0,2.442],
            // 8℃, 36℃
            [8,36,0.1,0.458],[8,36,0.2,0.813],[8,36,0.3,1.096],[8,36,0.4,1.33],[8,36,0.5,1.527],
            [8,36,0.6,1.696],[8,36,0.7,1.842],[8,36,0.8,1.967],[8,36,0.9,2.074],[8,36,1.0,2.167],
            // 8℃, 38℃
            [8,38,0.1,0.408],[8,38,0.2,0.725],[8,38,0.3,0.977],[8,38,0.4,1.186],[8,38,0.5,1.362],
            [8,38,0.6,1.512],[8,38,0.7,1.642],[8,38,0.8,1.754],[8,38,0.9,1.849],[8,38,1.0,1.932]
        ];
        
        // 提取所有COP值用于范围计算
        const copList = rawDataRows.map(row => row[3]);
        const minCOP = Math.min(...copList);   // 约 0.303
        const maxCOP = Math.max(...copList);   // 约 3.135
        
        // 气泡半径范围 (像素)
        const minRadius = 3.8;
        const maxRadius = 13.5;
        
        // 工具函数：根据COP值线性映射到气泡半径
        function mapCopToRadius(cop) {
            if (maxCOP === minCOP) return (minRadius + maxRadius) / 2;
            const t = (cop - minCOP) / (maxCOP - minCOP);
            return minRadius + t * (maxRadius - minRadius);
        }
        
        // 颜色映射：红 -> 黄 -> 绿 -> 蓝 (基于COP线性插值，符合红黄绿蓝区间)
        // t = 0 (低COP, 红色) , t ≈ 0.33 黄色, t ≈ 0.66 绿色, t = 1 蓝色
        function getColorByCop(cop) {
            let t = (cop - minCOP) / (maxCOP - minCOP);
            // 确保t在[0,1]区间
            t = Math.min(1.0, Math.max(0.0, t));
            
            let r, g, b;
            // 分段： 红(1,0,0) -> 黄(1,1,0) -> 绿(0,1,0) -> 蓝(0,0,1)
            if (t < 0.33) {
                // 红 -> 黄 区间 [0, 0.33]
                const ratio = t / 0.33;   // 0..1
                r = 255;
                g = 255 * ratio;
                b = 0;
            } else if (t < 0.66) {
                // 黄 -> 绿 区间 [0.33, 0.66]
                const ratio = (t - 0.33) / 0.33;   // 0..1
                r = 255 * (1 - ratio);
                g = 255;
                b = 0;
            } else {
                // 绿 -> 蓝 区间 [0.66, 1]
                const ratio = (t - 0.66) / 0.34;   // 0..1
                r = 0;
                g = 255 * (1 - ratio);
                b = 255 * ratio;
            }
            
            // 取整并确保边界
            r = Math.floor(Math.min(255, Math.max(0, r)));
            g = Math.floor(Math.min(255, Math.max(0, g)));
            b = Math.floor(Math.min(255, Math.max(0, b)));
            
            return `rgb(${r}, ${g}, ${b})`;
        }
        
        // 构建气泡图数据数组 (每个点独立颜色和大小)
        const seriesData = rawDataRows.map(row => {
            const supply = row[0];
            const returnTemp = row[1];
            const load = row[2];
            const cop = row[3];
            const radius = mapCopToRadius(cop);
            const color = getColorByCop(cop);
            return {
                value: [supply, returnTemp, load, cop],
                symbolSize: radius,
                itemStyle: {
                    color: color,
                    borderColor: 'rgba(255,255,240,0.6)',
                    borderWidth: 0.5,
                    shadowBlur: 5,
                    shadowColor: 'rgba(0,0,0,0.15)'
                }
            };
        });
        
        // 渲染图表
        const dom = document.getElementById('main');
        const myChart = echarts.init(dom);
        
        // 配置选项：浅色背景，仅保留图例 (右侧渐变条+大小示意) 与图表本身，删除所有额外注释
        const option = {
            backgroundColor: '#fefefe',
            toolbox: {
                show: true,
                feature: {
                    saveAsImage: { title: '保存图片', backgroundColor: '#ffffff' },
                    restore: { title: '重置视角' }
                },
                right: 20,
                top: 20,
                iconStyle: { borderColor: '#2c3e66' }
            },
            // 简洁标题 (无副标题)
            title: {
                show: true,
                text: 'COP 性能气泡图',
                left: 'center',
                top: 8,
                textStyle: {
                    color: '#1f2937',
                    fontSize: 18,
                    fontWeight: 'bold',
                    fontFamily: 'PingFang SC, Roboto'
                }
            },
            grid3D: {
                viewControl: {
                    autoRotate: false,
                    rotateSensitivity: 1.5,
                    zoomSensitivity: 1.2,
                    distance: 230,
                    alpha: 38,
                    beta: 48,
                    minDistance: 80,
                    maxDistance: 450
                },
                light: {
                    main: {
                        intensity: 1.3,
                        shadow: true,
                        shadowQuality: 'medium'
                    },
                    ambient: {
                        intensity: 0.6
                    }
                },
                environment: 'none',
                axisLine: {
                    lineStyle: { color: '#3b4e6b', width: 2 }
                },
                axisTick: {
                    show: true,
                    length: 8,
                    lineStyle: { color: '#6c7a8e' }
                },
                axisLabel: {
                    fontSize: 11,
                    fontWeight: '500',
                    color: '#1e293b',
                    backgroundColor: 'rgba(255,255,240,0.5)',
                    padding: [2, 4, 2, 4],
                    borderRadius: 4
                },
                splitLine: {
                    lineStyle: { color: '#d4dcec', width: 0.8, type: 'dashed' }
                },
                axisPointer: {
                    show: true,
                    lineStyle: { color: '#f97316', width: 1.5 }
                }
            },
            xAxis3D: {
                name: '冷冻供水温度 (℃)',
                nameTextStyle: {
                    fontSize: 13,
                    fontWeight: 'bold',
                    color: '#1e3a8a',
                    fontFamily: 'monospace'
                },
                type: 'value',
                min: 5.8,
                max: 8.2,
                axisLabel: {
                    formatter: '{value} ℃',
                    interval: 1
                }
            },
            yAxis3D: {
                name: '冷却回水温度 (℃)',
                nameTextStyle: {
                    fontSize: 13,
                    fontWeight: 'bold',
                    color: '#1e3a8a',
                    fontFamily: 'monospace'
                },
                type: 'value',
                min: 29,
                max: 39,
                axisLabel: {
                    formatter: '{value} ℃'
                }
            },
            zAxis3D: {
                name: '负荷率',
                nameTextStyle: {
                    fontSize: 13,
                    fontWeight: 'bold',
                    color: '#1e3a8a',
                    fontFamily: 'monospace'
                },
                type: 'value',
                min: 0,
                max: 1.05,
                axisLabel: {
                    formatter: (value) => value.toFixed(1)
                }
            },
            series: [{
                name: 'COP 性能气泡',
                type: 'scatter3D',
                data: seriesData,
                emphasis: {
                    scale: 1.35,
                    label: {
                        show: true,
                        formatter: function(params) {
                            if (params.value && params.value.length >= 4) {
                                const val = params.value;
                                return `COP: ${val[3].toFixed(3)}\n冷冻供水: ${val[0]}℃ | 冷却回水: ${val[1]}℃\n负荷率: ${val[2].toFixed(2)}`;
                            }
                            return '';
                        },
                        position: 'top',
                        backgroundColor: 'rgba(30,40,60,0.9)',
                        borderColor: '#ffaa44',
                        borderRadius: 8,
                        padding: [6, 12],
                        fontSize: 12,
                        color: '#f0f9ff',
                        fontWeight: 'bold'
                    },
                    itemStyle: {
                        shadowBlur: 18,
                        shadowColor: 'rgba(0,0,0,0.4)',
                        borderWidth: 1.2,
                        borderColor: '#ffffff'
                    }
                },
                progressive: 0,
                tooltip: {
                    show: true,
                    formatter: function(params) {
                        if (params.data && params.data.value && params.data.value.length >= 4) {
                            const val = params.data.value;
                            const copVal = val[3];
                            return `<strong style="color:#1e88e5">COP = ${copVal.toFixed(4)}</strong><br/>
                                    冷冻供水: ${val[0]} ℃ &nbsp;|&nbsp; 冷却回水: ${val[1]} ℃<br/>
                                    负荷率: ${val[2].toFixed(2)}`;
                        }
                        return 'COP性能数据';
                    },
                    backgroundColor: 'rgba(20,30,45,0.85)',
                    borderColor: '#facc15',
                    borderWidth: 1,
                    textStyle: { color: '#f1f5f9', fontSize: 12 }
                }
            }],
            // 简洁图例 (右侧渐变条 + 大小示意) 无多余注释文字
            graphic: [
                {
                    type: 'group',
                    left: 'right',
                    top: 'middle',
                    bounding: 'absolute',
                    z: 100,
                    children: [
                        // 颜色渐变条
                        {
                            type: 'rect',
                            shape: { x: -20, y: -110, width: 24, height: 160 },
                            style: {
                                fill: {
                                    type: 'linear',
                                    x: 0, y: 0, x2: 0, y2: 1,
                                    colorStops: [
                                        { offset: 0, color: '#3b82f6' },   // 蓝 (高COP)
                                        { offset: 0.34, color: '#22c55e' }, // 绿
                                        { offset: 0.67, color: '#eab308' }, // 黄
                                        { offset: 1, color: '#ef4444' }     // 红 (低COP)
                                    ]
                                },
                                stroke: '#334155',
                                lineWidth: 1,
                                shadowBlur: 3
                            }
                        },
                        // 简单的高/低标注 (图例必要部分)
                        {
                            type: 'text',
                            shape: { x: 6, y: -118 },
                            style: {
                                text: '高 COP',
                                fill: '#1e293b',
                                fontSize: 11,
                                fontWeight: 'bold'
                            }
                        },
                        {
                            type: 'text',
                            shape: { x: 6, y: 58 },
                            style: {
                                text: '低 COP',
                                fill: '#1e293b',
                                fontSize: 11,
                                fontWeight: 'bold'
                            }
                        },
                        // 大气泡示意 (蓝色)
                        {
                            type: 'circle',
                            shape: { cx: 24, cy: -148, r: 8 },
                            style: { fill: '#3b82f6', stroke: '#ffffff', lineWidth: 1.2, shadowBlur: 3 }
                        },
                        // 小气泡示意 (红色)
                        {
                            type: 'circle',
                            shape: { cx: 24, cy: 72, r: 4 },
                            style: { fill: '#ef4444', stroke: '#ffffff', lineWidth: 1.2, shadowBlur: 2 }
                        },
                        {
                            type: 'text',
                            shape: { x: 38, y: -152 },
                            style: { text: '大气泡', fill: '#334155', fontSize: 10, fontWeight: 'normal' }
                        },
                        {
                            type: 'text',
                            shape: { x: 38, y: 68 },
                            style: { text: '小气泡', fill: '#334155', fontSize: 10, fontWeight: 'normal' }
                        }
                    ]
                }
            ]
        };
        
        myChart.setOption(option);
        
        window.addEventListener('resize', () => {
            myChart.resize();
        });
        
        setTimeout(() => {
            myChart.resize();
        }, 150);
        
        console.log("3D气泡图渲染完成，颜色区间红→黄→绿→蓝，气泡大小同时映射COP，已移除额外注释");
    })();
</script>
</body>
</html>

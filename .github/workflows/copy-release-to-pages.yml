# .github/workflows/copy-release-to-pages.yml
name: Copy Release Assets to GitHub Pages

# 强制使用 Node.js 24 运行 Actions，提前适配未来环境
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release 标签名（例如 v1.2）'
        required: false
        type: string

permissions:
  contents: write

jobs:
  copy-assets:
    name: Copy Assets to Pages Branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the pages branch
        uses: actions/checkout@v4
        with:
          ref: 'main'

      - name: Download Release Asset
        uses: robinraju/release-downloader@v1.8
        with:
          repository: ${{ github.repository }}
          tag: ${{ github.event.inputs.tag_name || github.event.release.tag_name }}
          fileName: "*.glb"  # 下载所有 .glb 文件
          out-file-path: "./glb/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: main
          keep_files: true    # ✅ 关键：保留 main 分支上已有的其他文件，只添加新文件
          force_orphan: false

# .github/workflows/copy-release-to-pages.yml
name: Copy Release Assets to GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:  # 允许手动触发
    inputs:
      tag_name:
        description: 'Release 标签名（例如 v1.2）'
        required: false
        type: string

permissions:
  contents: write

jobs:
  copy-assets:
    name: Copy Assets to Pages Branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the pages branch
        uses: actions/checkout@v4
        with:
          ref: 'main'

      - name: Download Release Asset
        uses: robinraju/release-downloader@v1.8
        with:
          repository: ${{ github.repository }}
          tag: ${{ github.event.inputs.tag_name || github.event.release.tag_name }}
          fileName: "*.glb"  # ✅ 下载所有 .glb 文件，不再限制具体文件名
          out-file-path: "./glb/glb/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: main
          force_orphan: false
